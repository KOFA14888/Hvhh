name: Android build
on:
  push:
    branches: ['arena/4917e2ae-hvhh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build ARM64 library
        working-directory: xevilight_internal/internal
        run: '"$ANDROID_HOME/ndk/27.2.12479018/ndk-build" -j2' 
      - name: Test menu
        working-directory: xevilight_internal/internal
        run: python3 checks/verify_standard_menu.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: injector
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hvhh-android-arm64
          if-no-files-found: error
          path: |
            injector/app/build/outputs/apk/debug/*.apk
            xevilight_internal/internal/libs/arm64-v8a/libastra.so
