name: Android build
on:
  push:
    branches: ['arena/4917e2ae-hvhh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android packages
        shell: bash
        run: |
          set -eo pipefail
          trap 'rc=$?; echo "Install exited with status $rc" >> "$GITHUB_STEP_SUMMARY"; tail -c 30000 "$RUNNER_TEMP/install.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' EXIT
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          # GitHub-hosted Ubuntu runners include the Android SDK command-line tools.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # yes can receive SIGPIPE when sdkmanager finishes reading; check sdkmanager's status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build ARM64 library
        working-directory: xevilight_internal/internal
        run: |
          set -o pipefail
          trap 'rc=$?; echo "Native build exited with status $rc" >> "$GITHUB_STEP_SUMMARY"; tail -c 30000 "$RUNNER_TEMP/native.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true; if [ "$rc" -ne 0 ]; then grep -E "(error:|fatal error:|undefined reference|No rule to make target)" "$RUNNER_TEMP/native.log" | head -n 40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done; fi' EXIT
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" -j2 2>&1 | tee "$RUNNER_TEMP/native.log"
          test -s libs/arm64-v8a/libastra.so
      - name: Test menu
        working-directory: xevilight_internal/internal
        run: python3 checks/verify_standard_menu.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: injector
        run: |
          set -o pipefail
          trap 'rc=$?; echo "APK build exited with status $rc" >> "$GITHUB_STEP_SUMMARY"; tail -c 30000 "$RUNNER_TEMP/gradle.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' EXIT
          gradle --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - uses: actions/upload-artifact@v4
        with:
          name: hvhh-android-arm64
          if-no-files-found: error
          path: |
            injector/app/build/outputs/apk/debug/*.apk
            xevilight_internal/internal/libs/arm64-v8a/libastra.so
